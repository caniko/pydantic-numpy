# Generated by simit. Manual edits will be reported as ci=drift.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Project setup
        run: nix develop -c uv run --with 'numpy==2.3.5' --group test pytest tests

      - name: Check flake evaluation
        run: nix flake check --no-build

      - name: Build check flake-eval
        run: nix build .#checks.x86_64-linux.flake-eval

      - name: Build check formatting
        run: nix build .#checks.x86_64-linux.formatting

      - name: Build check offline-tests
        run: nix build .#checks.x86_64-linux.offline-tests

      - name: Build check typecheck
        run: nix build .#checks.x86_64-linux.typecheck

      - name: Build check uv-format
        run: nix build .#checks.x86_64-linux.uv-format
